<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Sum</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.app{width:min(430px,100%);background:#181818;padding:20px}
h1{text-align:center;font-size:24px;margin:4px 0 18px}
.setup,.calc{background:#222;border-radius:22px;padding:18px}
label{display:block;color:#bbb;font-size:13px;margin:12px 0 6px}
input{width:100%;padding:15px;border:1px solid #444;border-radius:12px;background:#111;color:#fff;font-size:22px}
button{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer}
.start{width:100%;margin-top:18px}
.display{height:105px;background:#080808;border-radius:16px;margin-bottom:12px;padding:18px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.status{font-size:13px;color:#aaa;min-height:18px}
.screen{font-size:42px;white-space:nowrap;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.key{background:#303030;color:#fff;height:64px}
.op{background:#555}
.zero{grid-column:span 2}
.hidden{display:none}
.small{font-size:12px;color:#888;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app">
<h1>MAGIC SUM</h1>

<div id="setup" class="setup">
<div style="color:#aaa;text-align:center;font-size:14px">PERFORMER SETUP</div>
<label>Target number</label>
<input id="target" inputmode="numeric" maxlength="12" placeholder="Enter target">
<label>Normal numbers before reveal</label>
<input id="count" inputmode="numeric" value="3" maxlength="2">
<button class="start" id="start">START</button>
<div class="small">Performer setup only.</div>
</div>

<div id="calc" class="calc hidden">
<div class="display">
<div id="status" class="status"></div>
<div id="screen" class="screen">0</div>
</div>

<div id="keys" class="keys">
<button class="key" data-k="7">7</button>
<button class="key" data-k="8">8</button>
<button class="key" data-k="9">9</button>
<button class="key op" data-k="+">+</button>

<button class="key" data-k="4">4</button>
<button class="key" data-k="5">5</button>
<button class="key" data-k="6">6</button>
<button class="key op" data-k="-">−</button>

<button class="key" data-k="1">1</button>
<button class="key" data-k="2">2</button>
<button class="key" data-k="3">3</button>
<button class="key op" data-k="*">×</button>

<button class="key zero" data-k="0">0</button>
<button class="key" data-k=".">.</button>
<button class="key op" data-k="=">=</button>

<button class="key" data-k="AC">AC</button>
<button class="key" data-k="BACK">⌫</button>
</div>
</div>
</div>

<script>
(function(){
let target=0,normalCount=3,entries=0,total=0,current="";
let blind=false,revealReady=false,pendingBase=0,timer=null;

const $=id=>document.getElementById(id);
const screen=$("screen"),status=$("status"),keys=$("keys");

function render(){screen.textContent=current===""?"0":current}
function setStatus(s){status.textContent=s}

$("start").addEventListener("click",()=>{
 const t=$("target").value.trim();
 const c=parseInt($("count").value,10);
 if(!/^\d+$/.test(t)||Number(t)<=0){alert("Enter a numeric target.");return}
 if(!Number.isInteger(c)||c<1||c>20){alert("Choose 1–20.");return}
 target=Number(t);normalCount=c;entries=0;total=0;current="";
 blind=false;revealReady=false;pendingBase=0;
 $("setup").classList.add("hidden");
 $("calc").classList.remove("hidden");
 setStatus("");
 render();
});

keys.addEventListener("click",e=>{
 const b=e.target.closest("button");
 if(!b)return;
 press(b.dataset.k);
});

function press(k){
 if(blind)return;

 if(revealReady){
   if(k==="+"){
     revealReady=false;
     setStatus("");
     return;
   }
   if(k==="=")finishReveal();
   return;
 }

 if(k>="0"&&k<="9"){
   current=(current==="0"?"" : current)+k;
   render();
   return;
 }

 if(k==="."){
   if(!current.includes(".")){
     current=current||"0";
     current+=".";
     render();
   }
   return;
 }

 if(k==="BACK"){
   current=current.slice(0,-1);
   render();
   return;
 }

 if(k==="AC"){
   current="";total=0;entries=0;
   setStatus("");
   render();
   return;
 }

 if(k==="+"){
   const n=Number(current);
   if(!Number.isFinite(n))return;
   total+=n;
   entries++;
   current="";
   render();

   if(entries>=normalCount)beginReveal();
   return;
 }
}

function beginReveal(){
 const diff=target-total;
 if(diff<=0){
   setStatus("");
   return;
 }

 blind=true;
 pendingBase=total;

 // No overlay, popup, countdown, message or visible hint.
 // All spectator taps are ignored during this interval.
 timer=setTimeout(()=>autoType(String(diff)),1800);
}

function autoType(value){
 current="";
 render();

 let i=0;

 function typeNext(){
   if(i<value.length){
     current+=value[i++];
     render();
     timer=setTimeout(typeNext,180);
   }else{
     blind=false;
     revealReady=true;
     setStatus("");
   }
 }

 typeNext();
}

function finishReveal(){
 const diff=Number(current);
 total=pendingBase+diff;
 current=String(total);
 revealReady=false;
 setStatus("");
 render();
}
})();
</script>
</body>
</html>
