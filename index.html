from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#f7f7f9;color:#34343a}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:#f7f7f9;display:flex;flex-direction:column}
.setup{padding:28px 22px}
.setup h2{font-size:25px;margin:8px 0 24px;font-weight:500}
.setup label{display:block;font-size:14px;color:#666;margin:16px 0 7px}
.setup input{width:100%;height:52px;border:1px solid #ddd;border-radius:12px;background:white;padding:0 14px;font-size:20px;outline:none}
.start{width:100%;height:54px;margin-top:22px;border:0;border-radius:14px;background:#4ca000;color:white;font-size:18px;font-weight:600}
.calc{display:flex;flex-direction:column;min-height:100vh;padding:0 18px 24px}
.display{height:42vh;min-height:310px;max-height:600px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px 15px}
.expression{height:34px;text-align:right;color:#a8a8ad;font-size:20px;white-space:nowrap;overflow:hidden}
.screen{height:76px;text-align:right;font-size:58px;font-weight:300;letter-spacing:-2px;white-space:nowrap;overflow:hidden;color:#303037}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 0 4px}
.key{height:76px;border:0;border-radius:50%;background:#fff;color:#34343a;font-size:31px;font-weight:400;box-shadow:none}
.key:active{background:#e7e7e9}
.operator{background:#ededee;color:#278000}
.clear{color:#d33b3b}
.equals{background:#51a800;color:white}
.zero{grid-column:auto}
.hidden{display:none!important}
@media(max-width:360px){
 .keys{gap:8px}.key{height:65px;font-size:27px}.display{min-height:280px}.screen{font-size:48px}
}
</style>
</head>
<body>
<div class="app">

<section id="setup" class="setup">
  <h2>Calculator</h2>
  <label>Target number</label>
  <input id="target" inputmode="numeric" maxlength="12" autocomplete="off">
  <label>Number of entries</label>
  <input id="count" inputmode="numeric" maxlength="2" value="3" autocomplete="off">
  <button class="start" id="start">Start</button>
</section>

<section id="calc" class="calc hidden">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="screen" id="screen">0</div>
  </div>

  <div class="keys" id="keys">
    <button class="key clear" data-k="AC">C</button>
    <button class="key" data-k="paren">()</button>
    <button class="key" data-k="%">%</button>
    <button class="key operator" data-k="/">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key operator" data-k="*">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key operator" data-k="-">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key operator" data-k="+">+</button>

    <button class="key" data-k="sign">+/−</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k=".">.</button>
    <button class="key equals" data-k="=">=</button>
  </div>
</section>
</div>

<script>
(() => {
  let target=0, entryLimit=3, entryCount=0, total=0, current="";
  let blind=false, revealReady=false, pendingBase=0, timer=null;

  const setup=document.getElementById("setup");
  const calc=document.getElementById("calc");
  const targetInput=document.getElementById("target");
  const countInput=document.getElementById("count");
  const start=document.getElementById("start");
  const keys=document.getElementById("keys");
  const screen=document.getElementById("screen");
  const expression=document.getElementById("expression");

  function render(){
    screen.textContent=current==="" ? "0" : current;
  }

  function reset(){
    if(timer) clearTimeout(timer);
    target=0;entryLimit=3;entryCount=0;total=0;current="";
    blind=false;revealReady=false;pendingBase=0;
    expression.textContent="";
    render();
  }

  start.addEventListener("click",()=>{
    const raw=targetInput.value.trim();
    const count=Number.parseInt(countInput.value,10);

    if(!/^\d+$/.test(raw)||Number(raw)<=0){
      alert("Enter a numeric target.");
      return;
    }
    if(!Number.isInteger(count)||count<1||count>20){
      alert("Enter a number from 1 to 20.");
      return;
    }

    reset();
    target=Number(raw);
    entryLimit=count;

    setup.classList.add("hidden");
    calc.classList.remove("hidden");
  });

  keys.addEventListener("click",(event)=>{
    const button=event.target.closest("button");
    if(!button)return;
    press(button.dataset.k);
  });

  function press(k){
    // During the 10-second hands-on interval and automatic entry,
    // every spectator keypad press is ignored.
    if(blind)return;

    if(revealReady){
      if(k==="+"){
        revealReady=false;
        expression.textContent="";
        return;
      }
      if(k==="=")finishReveal();
      return;
    }

    if(/^\d$/.test(k)){
      current=(current==="0" ? "" : current)+k;
      render();
      return;
    }

    if(k==="."){
      if(!current.includes(".")){
        current=current||"0";
        current+=".";
        render();
      }
      return;
    }

    if(k==="AC"){
      current="";
      total=0;
      entryCount=0;
      render();
      expression.textContent="";
      return;
    }

    if(k==="sign"){
      if(current){
        current=current.startsWith("-")?current.slice(1):"-"+current;
        render();
      }
      return;
    }

    if(k==="%"){
      const n=Number(current||0);
      if(Number.isFinite(n)){
        current=String(n/100);
        render();
      }
      return;
    }

    if(k==="paren"){
      return;
    }

    if(k==="+"){
      const n=Number(current);
      if(!Number.isFinite(n))return;

      total+=n;
      entryCount++;
      current="";
      render();

      if(entryCount>=entryLimit){
        beginBlindInterval();
      }
    }
  }

  function beginBlindInterval(){
    const difference=target-total;

    if(difference<=0){
      return;
    }

    blind=true;
    pendingBase=total;

    // Exactly 10 seconds. No overlay, message, countdown or hint.
    timer=setTimeout(()=>{
      autoType(String(difference));
    },10000);
  }

  function autoType(value){
    current="";
    render();

    let index=0;

    function typeNext(){
      if(index<value.length){
        current+=value[index++];
        render();
        timer=setTimeout(typeNext,180);
      }else{
        blind=false;
        revealReady=true;
      }
    }

    typeNext();
  }

  function finishReveal(){
    const difference=Number(current);
    total=pendingBase+difference;
    current=String(total);
    revealReady=false;
    render();
  }

  render();
})();
</script>
</body>
</html>'''

path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(f"Created: {path}")
