<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{
  background:#f8f8fa;
  color:#303036;
  font-family:Arial,Roboto,sans-serif;
  touch-action:manipulation;
}
.app{
  width:100%;
  height:100%;
  max-width:430px;
  margin:auto;
  background:#f8f8fa;
  display:flex;
  flex-direction:column;
}
.setup{
  padding:28px 22px;
}
.setup h2{font-size:25px;font-weight:400;margin:4px 0 24px}
.setup label{display:block;font-size:14px;color:#666;margin:16px 0 7px}
.setup input{
  width:100%;height:52px;border:1px solid #ddd;border-radius:13px;
  background:#fff;padding:0 14px;font-size:20px;outline:none;
}
.start{
  width:100%;height:54px;margin-top:22px;border:0;border-radius:14px;
  background:#4da600;color:#fff;font-size:18px;font-weight:600;
}
.calc{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  padding:0 22px;
}
.display{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 8px 22px;
}
.expression{
  height:30px;text-align:right;color:#b4b4b8;
  font-size:20px;white-space:nowrap;overflow:hidden;
}
.screen{
  text-align:right;color:#34343a;
  font-size:clamp(54px,14vw,72px);
  font-weight:300;line-height:1.05;
  white-space:nowrap;overflow:hidden;
}
.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
.key{
  width:100%;
  aspect-ratio:1;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#35353a;
  font-size:clamp(27px,7.5vw,35px);
  font-weight:400;
  padding:0;
}
.key:active{background:#e5e5e7}
.operator{background:#ededee;color:#298100}
.clear{color:#d23b3b}
.equals{background:#4fa800;color:white}
.hidden{display:none!important}

/* Samsung A13 portrait proportions */
@media(min-width:390px) and (max-width:430px){
  .calc{padding:0 27px}
  .keys{gap:13px}
  .display{padding-bottom:24px}
}

/* Small phones */
@media(max-width:370px){
  .calc{padding:0 16px}
  .keys{gap:9px}
  .display{padding-bottom:15px}
}
</style>
</head>
<body>

<div class="app">

  <section id="setup" class="setup">
    <h2>Calculator</h2>

    <label>Target number</label>
    <input id="target" inputmode="numeric" maxlength="12" autocomplete="off">

    <label>Number of entries</label>
    <input id="count" inputmode="numeric" maxlength="2" value="3" autocomplete="off">

    <button class="start" id="start">Start</button>
  </section>

  <section id="calc" class="calc hidden">

    <div class="display">
      <div id="expression" class="expression"></div>
      <div id="screen" class="screen">0</div>
    </div>

    <div id="keys" class="keys">
      <button class="key clear" data-k="AC">C</button>
      <button class="key" data-k="paren">()</button>
      <button class="key" data-k="%">%</button>
      <button class="key operator" data-k="/">÷</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key operator" data-k="*">×</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key operator" data-k="-">−</button>

      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key operator" data-k="+">+</button>

      <button class="key" data-k="sign">+/−</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k=".">.</button>
      <button class="key equals" data-k="=">=</button>
    </div>
  </section>
</div>

<script>
(() => {
  let target=0;
  let entryLimit=3;
  let entryCount=0;
  let total=0;
  let current="";
  let blind=false;
  let revealReady=false;
  let pendingBase=0;
  let timer=null;

  const setup=document.getElementById("setup");
  const calc=document.getElementById("calc");
  const targetInput=document.getElementById("target");
  const countInput=document.getElementById("count");
  const start=document.getElementById("start");
  const keys=document.getElementById("keys");
  const screen=document.getElementById("screen");

  function render(){
    screen.textContent=current==="" ? "0" : current;
  }

  start.addEventListener("click",()=>{
    const raw=targetInput.value.trim();
    const count=parseInt(countInput.value,10);

    if(!/^\d+$/.test(raw)||Number(raw)<=0){
      alert("Enter a numeric target.");
      return;
    }

    if(!Number.isInteger(count)||count<1||count>20){
      alert("Enter a number from 1 to 20.");
      return;
    }

    target=Number(raw);
    entryLimit=count;
    entryCount=0;
    total=0;
    current="";
    blind=false;
    revealReady=false;
    pendingBase=0;

    setup.classList.add("hidden");
    calc.classList.remove("hidden");
    render();
  });

  keys.addEventListener("click",(event)=>{
    const button=event.target.closest("button");
    if(button) press(button.dataset.k);
  });

  function press(k){

    // Hidden 10-second interval:
    // all spectator taps are ignored.
    if(blind) return;

    if(revealReady){
      if(k==="+"){
        revealReady=false;
        return;
      }
      if(k==="=") finishReveal();
      return;
    }

    if(/^\d$/.test(k)){
      current=(current==="0" ? "" : current)+k;
      render();
      return;
    }

    if(k==="."){
      if(!current.includes(".")){
        current=current||"0";
        current+=".";
        render();
      }
      return;
    }

    if(k==="AC"){
      current="";
      total=0;
      entryCount=0;
      render();
      return;
    }

    if(k==="sign"){
      if(current){
        current=current.startsWith("-") ? current.slice(1) : "-"+current;
        render();
      }
      return;
    }

    if(k==="%"){
      const n=Number(current||0);
      if(Number.isFinite(n)){
        current=String(n/100);
        render();
      }
      return;
    }

    // Kept visually for the calculator appearance.
    if(k==="paren") return;

    if(k==="+"){
      const n=Number(current);
      if(!Number.isFinite(n)) return;

      total+=n;
      entryCount++;
      current="";
      render();

      if(entryCount>=entryLimit){
        beginHiddenInterval();
      }
    }
  }

  function beginHiddenInterval(){
    const difference=target-total;

    if(difference<=0) return;

    blind=true;
    pendingBase=total;

    // Ten seconds with absolutely no visible UI change.
    timer=setTimeout(()=>{
      autoType(String(difference));
    },10000);
  }

  function autoType(value){
    current="";
    render();

    let i=0;

    function nextDigit(){
      if(i<value.length){
        current+=value[i++];
        render();
        timer=setTimeout(nextDigit,180);
      }else{
        blind=false;
        revealReady=true;
      }
    }

    nextDigit();
  }

  function finishReveal(){
    const difference=Number(current);
    total=pendingBase+difference;
    current=String(total);
    revealReady=false;
    render();
  }
})();
</script>
</body>
</html>'''

path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
